naftiko: 1.0.0-alpha2
info:
  label: Jupyter Server REST API — Kernelspecs
  description: 'Jupyter Server REST API — Kernelspecs. 1 operations. Lead operation: Jupyter Server List kernel specifications.
    Self-contained Naftiko capability covering one Jupyter Server business surface.'
  tags:
  - Jupyter Server
  - Kernelspecs
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    JUPYTER_SERVER_API_KEY: JUPYTER_SERVER_API_KEY
capability:
  consumes:
  - type: http
    namespace: rest-kernelspecs
    baseUri: http://localhost:8888/api
    description: Jupyter Server REST API — Kernelspecs business capability. Self-contained, no shared references.
    resources:
    - name: kernelspecs
      path: /kernelspecs
      operations:
      - name: listkernelspecs
        method: GET
        description: Jupyter Server List kernel specifications
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: apikey
      key: Authorization
      value: '{{env.JUPYTER_SERVER_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: rest-kernelspecs-rest
    port: 8080
    description: REST adapter for Jupyter Server REST API — Kernelspecs. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/kernelspecs
      name: kernelspecs
      description: REST surface for kernelspecs.
      operations:
      - method: GET
        name: listkernelspecs
        description: Jupyter Server List kernel specifications
        call: rest-kernelspecs.listkernelspecs
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: rest-kernelspecs-mcp
    port: 9090
    transport: http
    description: MCP adapter for Jupyter Server REST API — Kernelspecs. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: jupyter-server-list-kernel-specifications
      description: Jupyter Server List kernel specifications
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: rest-kernelspecs.listkernelspecs
      outputParameters:
      - type: object
        mapping: $.
