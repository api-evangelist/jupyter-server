naftiko: 1.0.0-alpha2
info:
  label: Jupyter Server REST API
  description: 'Jupyter Server REST API. 4 operations. Lead operation: Jupyter Server Get API info. Self-contained Naftiko
    capability covering one Jupyter Server business surface.'
  tags:
  - Jupyter Server
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    JUPYTER_SERVER_API_KEY: JUPYTER_SERVER_API_KEY
capability:
  consumes:
  - type: http
    namespace: rest-general
    baseUri: http://localhost:8888/api
    description: Jupyter Server REST API business capability. Self-contained, no shared references.
    resources:
    - name: root
      path: /
      operations:
      - name: getapiinfo
        method: GET
        description: Jupyter Server Get API info
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: me
      path: /me
      operations:
      - name: getcurrentuser
        method: GET
        description: Jupyter Server Get current user
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: spec.yaml
      path: /spec.yaml
      operations:
      - name: getapispec
        method: GET
        description: Jupyter Server Get API specification
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: status
      path: /status
      operations:
      - name: getserverstatus
        method: GET
        description: Jupyter Server Get server status
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: apikey
      key: Authorization
      value: '{{env.JUPYTER_SERVER_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: rest-general-rest
    port: 8080
    description: REST adapter for Jupyter Server REST API. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1
      name: root
      description: REST surface for root.
      operations:
      - method: GET
        name: getapiinfo
        description: Jupyter Server Get API info
        call: rest-general.getapiinfo
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/me
      name: me
      description: REST surface for me.
      operations:
      - method: GET
        name: getcurrentuser
        description: Jupyter Server Get current user
        call: rest-general.getcurrentuser
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/spec-yaml
      name: spec-yaml
      description: REST surface for spec.yaml.
      operations:
      - method: GET
        name: getapispec
        description: Jupyter Server Get API specification
        call: rest-general.getapispec
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/status
      name: status
      description: REST surface for status.
      operations:
      - method: GET
        name: getserverstatus
        description: Jupyter Server Get server status
        call: rest-general.getserverstatus
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: rest-general-mcp
    port: 9090
    transport: http
    description: MCP adapter for Jupyter Server REST API. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: jupyter-server-get-api-info
      description: Jupyter Server Get API info
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: rest-general.getapiinfo
      outputParameters:
      - type: object
        mapping: $.
    - name: jupyter-server-get-current-user
      description: Jupyter Server Get current user
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: rest-general.getcurrentuser
      outputParameters:
      - type: object
        mapping: $.
    - name: jupyter-server-get-api-specification
      description: Jupyter Server Get API specification
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: rest-general.getapispec
      outputParameters:
      - type: object
        mapping: $.
    - name: jupyter-server-get-server-status
      description: Jupyter Server Get server status
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: rest-general.getserverstatus
      outputParameters:
      - type: object
        mapping: $.
