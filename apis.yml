aid: jupyter-server
name: Jupyter Server
description: >-
  Jupyter Server is the backend that powers Jupyter Notebook, JupyterLab, and other Jupyter web applications. It
  provides the core REST API for managing kernels, sessions, contents, terminals, and configuration, and it hosts the
  WebSocket endpoints used to communicate with kernels via the Jupyter messaging protocol.
